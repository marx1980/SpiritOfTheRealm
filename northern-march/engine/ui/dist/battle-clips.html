body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; }

.guide li i { color: var(--mute); }

.field .hit { fill: transparent; pointer-events: all; cursor: pointer; }
.spot .stage .field { max-height: 74vh; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale button { text-align: center; font-variant-numeric: tabular-nums; }
.scale-ends { display: flex; justify-content: space-between; color: var(--mute); font-size: 14px; }
.note-l { color: var(--mute); font-size: 14px; }
textarea.note { min-height: 70px; font: 15px var(--f-body); padding: 8px; }
.answers { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
button { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 10px 12px; cursor: pointer; text-align: left; }
button:hover { border-color: var(--accent); } button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; } button:disabled { opacity: .5; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }

th { font-weight: 600; } tr.sub th { font-weight: 400; color: var(--mute); padding-left: 20px; }
