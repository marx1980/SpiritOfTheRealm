# Northern March debug page on GitHub Pages: built from the engine and published to the gh-pages branch.
# One-time setup: Settings > Pages > Source "Deploy from a branch", branch gh-pages, folder / (root).
name: pages
on:
  push:
    branches: [main, phase8-roster]
    paths: ["northern-march/engine/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: northern-march/engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23" }
      - run: npm ci
      - run: node ui/build.ts
      - name: Publish to gh-pages
        run: |
          mkdir -p /tmp/site && cp ui/dist/northern-march.html /tmp/site/index.html && touch /tmp/site/.nojekyll
          cd /tmp/site && git init -q -b gh-pages && git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Northern March page from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
